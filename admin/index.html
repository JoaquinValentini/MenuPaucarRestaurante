<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administrar · Lo de Paucar</title><link rel="stylesheet" href="/admin/style.css"></head><body><header><div><small>LO DE PAUCAR</small><h1>Administrar la carta</h1></div><nav><a href="/" target="_blank" rel="noopener">Ver menú ↗</a><button id="logout" hidden>Cerrar sesión</button></nav></header><main><p id="message" role="status"></p><button id="retry" hidden>Reintentar conexión</button><section id="auth" class="login" hidden><small>ACCESO PRIVADO</small><h2 id="authTitle">Bienvenido</h2><p id="authHelp">Ingresá con la cuenta del restaurante.</p><form id="loginForm"><label>Usuario<input id="username" autocomplete="username" required maxlength="40"></label><label>Contraseña<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><label id="confirmationLabel" hidden>Repetir contraseña<input id="confirmation" type="password" autocomplete="new-password"></label><button class="primary" id="loginButton">Ingresar</button></form></section><section id="editor" hidden><div class="toolbar"><label>Categoría<select id="category"></select></label><div><button id="add">+ Agregar producto</button><button class="primary" id="save">Guardar cambios</button></div></div><p id="count"></p><div id="products"></div></section></main><script src="/admin/app.js"></script></body></html>
